[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "An AI-powered code review tool"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Developer" }
]
keywords = ["code-review", "ai", "groq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.109.1",
    "uvicorn==0.23.2",
    "jinja2==3.1.6",
    "python-multipart==0.0.8",
    "pygments==2.16.1",
    "pylint==4.0.5",
    "groq>=1.4.0",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "matplotlib>=3.11.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.0",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "sympy>=1.14.0",
    "nltk>=3.9.4",
    "plotly>=6.8.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.10.0",
    "tqdm>=4.68.3",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "statsmodels>=0.14.6",
    "networkx>=3.6.1",
    "faker>=40.23.0",
    "python-dotenv>=1.2.2",
    "pyarrow>=24.0.0",
    "sqlalchemy>=2.0.51",
    "textblob>=0.20.0",
    "arrow>=1.4.0",
    "colorama>=0.4.6",
    "pillow>=12.2.0",
    "opencv-python-headless>=4.13.0.92",
    "xgboost>=3.3.0",
    "lightgbm>=4.6.0",
    "pyzmq>=27.1.0",
    "psutil>=7.2.2",
    "humanize>=4.15.0",
    "pendulum>=3.2.0",
    "inflect>=7.5.0",
    "spacy>=3.8.14",
    "gensim>=4.4.0",
    "wordcloud>=1.9.6",
    "vadersentiment>=3.3.2",
    "transformers>=5.12.1",
    "tokenizers>=0.22.2",
    "sentence-transformers>=5.6.0",
    "mat73>=0.65",
    "h5py>=3.16.0",
    "control>=0.10.2",
    "slycot>=0.7.0",
    "scikit-image>=0.26.0",
    "pywavelets>=1.9.0",
    "reportlab>=4.2.5",
    # Declared as a direct dependency (not just `spacy download`) so `uv sync`
    # never silently prunes it again — it isn't a regular PyPI package, so
    # anything installed by the spacy CLI outside pyproject.toml is invisible
    # to uv's dependency graph and gets removed on the next exact sync.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

